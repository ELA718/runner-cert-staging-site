name: Staging Site Deployment
run-name: Staging Site Deployment / ${{ inputs.receipt }}

on:
  workflow_dispatch:
    inputs:
      receipt:
        description: Certification receipt
        type: string
        required: true
      target_sha:
        description: Exact reviewed workflow SHA
        type: string
        required: true
      platform:
        description: Certified operational destination platform
        type: choice
        options: [linux, macos]
        default: linux
      release:
        description: Release identifier to deploy
        type: string
        required: true

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ["agr-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-validation-${{ inputs.platform == 'linux' && 'linux-' || '' }}deployment"]
    environment: staging-deploy
    timeout-minutes: 12
    steps:
      - name: Verify isolated assignment and resource boundaries
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ && "$GITHUB_SHA" == "$TARGET_SHA" ]]
          if [[ "$RUNNER_OS" == macOS ]]; then
            [[ "$(id -un)" =~ ^_agrrole[12]$ && "$HOME" == "/Users/$(id -un)" ]]
            [[ "$RUNNER_NAME" =~ ^nixon-runner-[67]$ ]]
            [[ ! -r /Users/nixon/.config/gh/hosts.yml && ! -r /Users/nixon/.ssh/agentroles-peer-ed25519 ]]
            if sudo -n /usr/bin/true; then exit 1; fi
            case " $(id -Gn) " in *' admin '*|*' staff '*|*' wheel '*) exit 1 ;; esac
            [[ ! -e "$HOME/deploy-residue" ]]
            printf '%s\n' "$GITHUB_RUN_ID" > "$HOME/deploy-residue"
          else
          [[ "$RUNNER_OS" == Linux && "$(id -u)" == 10001 && "$HOME" == /work/home ]]
          [[ ! -S /var/run/docker.sock && ! -e /home/grim && ! -e /root/.config/gh/hosts.yml ]]
          python3 - <<'PY'
          import json, os, pathlib
          a = json.loads(pathlib.Path('/work/control/assignment.json').read_text())
          assert (a['repo'], str(a['run']), str(a['attempt']), a['sha'], a['class']) == (
              os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_RUN_ID'],
              os.environ['GITHUB_RUN_ATTEMPT'], os.environ['TARGET_SHA'], 'deployment')
          status = dict(line.split(':', 1) for line in pathlib.Path('/proc/self/status').read_text().splitlines())
          assert int(status['NoNewPrivs']) == 1 and int(status['CapEff'], 16) == 0
          for name in ('control-residue', 'deploy-residue'):
              path = pathlib.Path.home() / name
              assert not path.exists(), 'prior owner residue'
              path.write_text(os.environ['GITHUB_RUN_ID'])
          PY
          fi
      - name: Publish release artifact
        env:
          RELEASE: ${{ inputs.release }}
          DEPLOY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, html, json, os, re, time, urllib.error, urllib.request
          api = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization': 'Bearer ' + os.environ['DEPLOY_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28',
                     'User-Agent': 'role-deploy-certification'}
          release = os.environ['RELEASE']
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,119}', release)
          commit = os.environ['GITHUB_SHA']
          def put(path, body):
              try:
                  with urllib.request.urlopen(urllib.request.Request(api + path, headers=headers), timeout=30) as response:
                      existing = json.loads(response.read())
                  body['sha'] = existing['sha']
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              req = urllib.request.Request(api + path, data=json.dumps(body).encode(),
                                           headers=headers, method='PUT')
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read())
              assert result.get('commit', {}).get('sha'), result
          version = dict(release=release, commit=commit,
                         workflow_run=int(os.environ['GITHUB_RUN_ID']),
                         deployed_at=time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()))
          index = ('<!doctype html><meta charset="utf-8">'
                   '<title>runner-cert staging site</title>'
                   '<h1>runner certification staging site</h1>'
                   '<p>release: ' + html.escape(release) + '</p>'
                   '<p><a href="version.json">version.json</a></p>\n')
          put('/contents/index.html', dict(path='index.html',
              message='deploy staging release ' + release,
              content=base64.b64encode(index.encode()).decode()))
          put('/contents/version.json', dict(path='version.json',
              message='deploy staging release ' + release,
              content=base64.b64encode((json.dumps(version) + '\n').encode()).decode()))
          print('committed artifact for release', release)
          PY
      - name: Observe the public deployment serving the release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'https://ela718.github.io/runner-cert-staging-site/version.json'
          deadline = time.monotonic() + 480
          delay = 12
          last = None
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      served = json.loads(response.read())
                  if served.get('release') == os.environ['RELEASE']:
                      print('public URL serves release', served['release'], 'at', url)
                      raise SystemExit(0)
                  last = served
              except Exception as error:
                  last = type(error).__name__ + ': ' + str(error)[:120]
              time.sleep(delay)
          raise SystemExit('public deployment was not observed: ' + repr(last))
          PY
