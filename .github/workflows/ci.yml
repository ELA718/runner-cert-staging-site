name: Staging fixture checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ["agr-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}-validation-standard"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests
